# RetroFEVLC - Default Search Theme (Aeon Nox)
# Colours can be written as #RRGGBB or R,G,B.
# Copy this file and rename it to create your own theme.
# Select it in settings.conf using: searchTheme = filename
# Do not include .conf in the searchTheme setting.

# Main overlay
accent = #75C8F7
accentDk = #142A38
panel = #1B1D21
border = #52616B
card = #292D32
field = #111316
backdrop = #050608

# Text
textHi = #FFFFFF
textMid = #DEDEDE
textLow = #9AA5AD
noMatches = #FF7878

# Keyboard
keyFace = #343A40
keyEdge = #59636C
specialFace = #43505A
specialEdge = #657581
